<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>포켓몬스터 블로그</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;900&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            
            background-image: linear-gradient(rgba(255, 255, 255, 0.4), rgba(255, 255, 255, 0.4)), 
                              url('pikachu.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .logo-box {
            position: absolute; 
            top: 30px;          
            left: 40px;         
            color: white;       
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.6); 
        }

        .logo-box h1 {
            font-family: 'Poppins', sans-serif;
            font-size: 38px;
            font-weight: 900;
            letter-spacing: 2px;
            margin-bottom: 5px;
        }

        /* 🌟 기존 h2로 되어있던 부분을 p 태그로 맞추어 스타일이 정상 적용되도록 수정 */
        .logo-box p {
            font-family: 'Poppins', sans-serif;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 1px;
            opacity: 0.95;
        }

        .hashtag-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            background-color: rgba(255, 255, 255, 0.6); 
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            backdrop-filter: blur(5px);
        }

        .row {
            display: flex;
            justify-content: center;
            gap: 30px;
        }

        .hashtag {
            text-decoration: none;
            display: inline-block;
            font-size: 24px;
            font-weight: bold;
            color: #4a90e2;
            background-color: white;
            padding: 15px 30px;
            border-radius: 50px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: all 0.2s ease-in-out;
        }

        .hashtag:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 12px rgba(0, 0, 0, 0.15);
            text-decoration: underline;
            text-decoration-thickness: 3px; 
            text-underline-offset: 6px; 
        }

        /* =========================================
           📱 모바일 반응형 디자인 (화면 너비 768px 이하) 
           ========================================= */
        @media screen and (max-width: 768px) {
            .logo-box {
                top: 20px;
                left: 20px;
            }

            .logo-box h1 {
                font-size: 26px; /* 모바일용 로고 제목 크기 축소 */
            }

            .logo-box p {
                font-size: 13px; /* 모바일용 로고 부제목 크기 축소 */
            }

            .hashtag-container {
                width: 90%; /* 가로 여백 확보 */
                padding: 30px 20px; /* 내부 여백 축소 */
                gap: 15px; /* 줄 간격 축소 */
            }

            .row {
                flex-wrap: wrap; /* 버튼이 화면을 넘어가면 자동으로 다음 줄로 넘김 */
                gap: 15px; /* 버튼 사이 간격 축소 */
            }

            .hashtag {
                font-size: 16px; /* 버튼 글자 크기 축소 */
                padding: 10px 20px; /* 버튼 내부 여백 축소 */
            }
        }
    </style>
</head>
<body>

    <div class="logo-box">
        <h1>Pokémon Lover's</h1> 
        <p>New eXciting Odyssey</p>
    </div>

    <div class="hashtag-container">
        <div class="row">
            <a href="openworld.html" class="hashtag">#오픈월드</a>
            <a href="battle.html" class="hashtag">#배틀</a>
            <a href="story.html" class="hashtag">#스토리</a>
        </div>
        <div class="row">
            <a href="grab.html" class="hashtag">#포획</a>
            <a href="healing.html" class="hashtag">#힐링</a>
            <a href="othergames.html" class="hashtag">#이외 게임들</a>
        </div>
    </div>

</body>
</html>
