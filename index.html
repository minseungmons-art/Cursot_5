<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TeamSync - 팀플 시작하기</title>
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="background-effects">
        <div class="glow-orb orb-1"></div>
        <div class="glow-orb orb-2"></div>
    </div>

    <main class="glass-container auth-container">
        <div class="auth-header">
            <h1>TeamSync</h1>
            <p>우아하고 완벽한 팀 프로젝트 일정 조율</p>
        </div>
        
        <div class="auth-panels">
            <div class="auth-panel">
                <h2>새로운 방 만들기</h2>
                <p>팀원들을 초대할 방을 생성하세요</p>
                <input type="password" id="create-pw" placeholder="방 비밀번호 설정 (예: 1234)">
                <button id="create-btn" class="btn-secondary">방 생성하기</button>
                
                <div id="invite-info" style="display: none; margin-top: 15px; flex-direction: column; gap: 10px;">
                    <p style="color: var(--primary-color); font-size: 0.9rem; font-weight: 600;">방이 성공적으로 생성되었습니다!</p>
                    <input type="text" id="generated-link" readonly style="color: #a4b0be; background: rgba(0,0,0,0.2); font-size: 0.85rem; padding: 10px;">
                    <button id="copy-btn" class="btn-primary">🔗 초대 링크 복사</button>
                </div>
            </div>

            <div class="divider"></div>

            <div class="auth-panel">
                <h2>초대받은 방 입장하기</h2>
                <p>초대 코드와 비밀번호를 입력하세요</p>
                <input type="text" id="join-code" placeholder="초대 코드 (방 ID)">
                <input type="password" id="join-pw" placeholder="방 비밀번호">
                <input type="text" id="join-name" placeholder="내 이름 (예: 강민승)">
                <button id="join-btn" class="btn-primary">입장하기</button>
            </div>
        </div>

        <!-- 내 참가 기록 패널 (자바스크립트에서 기록이 있을 때만 표시함) -->
        <div id="history-panel" style="display: none; margin-top: 40px; text-align: left;">
            <div class="divider" style="width: 100%; height: 1px; margin-bottom: 30px;"></div>
            <h2 style="font-size: 1.3rem; margin-bottom: 15px;">최근 참여한 방 기록</h2>
            <div id="history-list" class="history-list"></div>
        </div>
    </main>

    <script src="index.js" defer></script>
</body>
</html>
