<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTHER GAMES - Pokémon</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;900&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', 'Apple SD Gothic Neo', sans-serif;
            color: white;
            background-color: black;
            
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        .background-layers {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1; 
        }

        .bg-slide {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0; 
            transition: opacity 1s ease-in-out; 
        }

        .bg-slide.active {
            opacity: 1; 
        }

        /* 🌟 첫 번째 섹션 배경화면 */
        .bg-slide.section1 { 
            background-image: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), url('diamond.jpg'); 
        }

        nav {
            position: fixed;
            top: 40px;
            right: 40px;
            z-index: 1000;
        }

        .back-home {
            text-decoration: none;
            color: white;
            font-weight: bold;
            padding: 10px 20px;
            border: 2px solid white;
            border-radius: 30px;
            transition: 0.3s;
            font-size: 14px;
        }

        .back-home:hover {
            background: white;
            color: #4a90e2;
        }

        .content-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .section {
            min-height: 100vh; 
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .content-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 0;
            transform: translateY(80px);
            transition: all 1s ease-out; 
            position: relative;
        }

        .content-box.show {
            opacity: 1;
            transform: translateY(0);
        }

        .section-num {
            font-size: 130px;
            font-weight: 900;
            line-height: 0.8;
            color: rgba(74, 144, 226, 0.3); 
            margin-bottom: -35px; 
            z-index: 0;
        }

        .title {
            font-size: 60px;
            font-weight: 900;
            margin-bottom: 24px;
            text-transform: uppercase;
            letter-spacing: -1px;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.4);
            z-index: 1;
            text-align: center;
            word-break: keep-all; /* 👈 단어가 중간에 쪼개지는 것을 막아주는 핵심 코드입니다! */
        }

        /* 🌟 본문 상자 디자인 */
        .desc {
            font-size: 18px;
            line-height: 1.8;
            color: rgba(255, 255, 255, 0.95);
            background: rgba(255, 255, 255, 0.15); 
            padding: 35px 50px;
            border-radius: 0 40px 0 40px; 
            border-left: 5px solid #4a90e2; 
            backdrop-filter: blur(10px);
            max-width: 750px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            word-break: keep-all; 
            z-index: 1;
        }

        /* =========================================
           📱 모바일 반응형 디자인 (화면 너비 768px 이하) 
           ========================================= */
        @media screen and (max-width: 768px) {
            nav {
                top: 20px;
                right: 20px;
            }

            .back-home {
                padding: 8px 16px;
                font-size: 12px;
            }

            .section-num {
                font-size: 80px; 
                margin-bottom: -20px;
            }

            .title {
                font-size: 28px; /* 👈 긴 제목이 화면에 꽉 차지 않도록 크기를 살짝 더 줄였습니다. */
                margin-bottom: 16px;
                line-height: 1.3;
            }

            /* 본문 모바일 조정 */
            .desc {
                font-size: 15px; 
                padding: 25px 20px; 
                border-radius: 0 25px 0 25px; 
                width: 95%; 
            }
        }
    </style>
</head>
<body>

    <nav>
        <a href="index.html" class="back-home">BACK TO MAIN</a>
    </nav>

    <div class="background-layers">
        <div class="bg-slide section1 active"></div>
    </div>

    <div class="content-wrapper">
        <div class="section" id="section1">
            <div class="content-box show">
                <div class="section-num">01</div>
                <h2 class="title">브릴리언트 다이아몬드·샤이닝 펄</h2>
                <div class="desc">
                    신오지방의 클래식한 모험을 다시 즐길 수 있지만, 원작을 그대로 옮겨온 듯하여 리메이크만의 새로운 재미나 추가 콘텐츠는 부족합니다. 호불호가 크게 갈리는 SD 그래픽과 과거에 머문 듯한 게임성 등 전체적인 완성도 면에서 많은 아쉬움을 남긴 작품입니다.<br>
                </div>
            </div>
        </div>
    </div>

    <script>
        const boxes = document.querySelectorAll('.content-box');
        window.addEventListener('scroll', checkBoxes);
        checkBoxes(); 

        function checkBoxes() {
            const triggerBottom = window.innerHeight * 0.85;
            boxes.forEach(box => {
                const boxTop = box.getBoundingClientRect().top;
                if(boxTop < triggerBottom) {
                    box.classList.add('show');
                } else {
                    box.classList.remove('show');
                }
            });
        }

        const sections = document.querySelectorAll('.section');
        const bgSlides = document.querySelectorAll('.bg-slide');
        
        window.addEventListener('scroll', checkBackgrounds);
        checkBackgrounds(); 

        function checkBackgrounds() {
            sections.forEach(section => {
                const rect = section.getBoundingClientRect();
                if (rect.top <= window.innerHeight / 2 && rect.bottom >= window.innerHeight / 2) {
                    const sectionId = section.id; 
                    
                    bgSlides.forEach(slide => slide.classList.remove('active'));
                    
                    const activeBg = document.querySelector(`.bg-slide.${sectionId}`);
                    if (activeBg) {
                        activeBg.classList.add('active');
                    }
                }
            });
        }
    </script>
</body>
</html>
