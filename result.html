<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TeamSync - 최적의 일정 결과</title>
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="background-effects">
        <div class="glow-orb orb-1"></div>
        <div class="glow-orb orb-2"></div>
    </div>
    <main class="glass-container main-app">
        <header class="app-header">
            <div>
                <h1>TeamSync Result</h1>
                <p>팀원들이 모두 모일 수 있는 최적의 시간입니다.</p>
            </div>
            <button id="back-btn" class="btn-secondary">시간표 다시 보기</button>
        </header>
        <section class="result-section">
            <div id="result-container" class="result-cards"></div>
        </section>
    </main>
    <script src="result.js" defer></script>
</body>
</html>
